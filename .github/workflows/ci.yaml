name: '🧑‍🏭'
on:
  push:
    tags: [ '*' ]
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6

      - name: 'Find Java version'
        run: echo "JAVA_VERSION=$(cat gradle.properties | grep -oP '^java_version=(\K[0-9\.]+)')" >> $GITHUB_ENV

      - uses: actions/setup-java@v6
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          check-latest: true
          cache: 'gradle'

      - run: ./gradlew --console plain --no-daemon --full-stacktrace check build

      - name: 'Generate color tables'
        run: ./scripts/generate.sh

      - name: 'Find Minecraft version'
        run: echo "MINECRAFT_VERSION=$(cat gradle.properties | grep -oP '^minecraft_version=(\K[0-9\.]+)')" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        with:
          name: '${{ env.MINECRAFT_VERSION }}'
          body: 'Generated for Minecraft version ${{ env.MINECRAFT_VERSION }} at Git commit ${{ github.sha }}'
          files: 'build/dist/*'
